name: CI

on:
  push:
    branches: ['main', 'feature/*', 'followup/*']
  pull_request:
    branches: ['main']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
        env:
          CI: true
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates fonts-liberation libnss3 libxss1 libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpangocairo-1.0-0 libgtk-3-0
      - name: Start preview
        run: |
          npm run start -- --port 5173 &
          # wait for the preview server to become available
          for i in {1..15}; do
            if curl -sSf http://localhost:5173 >/dev/null; then
              echo "preview ready" && break
            fi
            sleep 1
          done
      - name: Run e2e tests (Puppeteer)
        run: node src/e2e/headless_test.js
